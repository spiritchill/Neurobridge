<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NeuroBridge Dashboard</title>
<style>
  :root { --bg:#F6F8F7; --card:#fff; --ink:#1D2B27; --muted:#5C6D67; --line:#DCE6E2; --accent:#1F7A6C; --soft:#E3F0EC; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); line-height:1.55; }
  header { padding:16px 24px 0; }
  h1 { font-size:1.25rem; margin:0 0 10px; }
  nav { display:flex; flex-wrap:wrap; gap:6px; padding-bottom:12px; border-bottom:1px solid var(--line); }
  nav button { background:transparent; color:var(--ink); border:1px solid var(--line); }
  nav button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { max-width:760px; padding:20px 24px 60px; }
  h2 { font-size:1.1rem; margin:0 0 6px; }
  p.sub { color:var(--muted); margin:0 0 14px; font-size:.9rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  button { padding:8px 12px; border-radius:8px; border:none; background:var(--accent); color:#fff; cursor:pointer; font:inherit; font-size:.9rem; }
  button.ghost { background:var(--soft); color:var(--accent); }
  button.danger { background:#B3412F; }
  button:disabled { opacity:.5; cursor:default; }
  textarea, input[type=text], input[type=number], select { width:100%; padding:8px; border-radius:8px; border:1px solid var(--line); font:inherit; background:#fff; color:var(--ink); }
  textarea { min-height:110px; resize:vertical; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:12px 0 4px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  .row > * { flex:0 0 auto; } .row > .grow { flex:1 1 200px; }
  .out { white-space:pre-wrap; background:var(--soft); border-radius:10px; padding:12px; margin-top:12px; }
  .muted { color:var(--muted); font-size:.85rem; }
  .step { font-size:1.15rem; background:var(--soft); border-radius:10px; padding:14px; margin:10px 0; }
  .chip { padding:6px 10px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; font-size:.85rem; }
  .chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .bars { display:flex; gap:4px; align-items:flex-end; height:80px; margin-top:8px; }
  .bar { flex:1; background:var(--accent); border-radius:4px 4px 0 0; min-height:3px; }
  ul { padding-left:20px; margin:6px 0; }
  .progress { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin:6px 0; }
  .progress > div { height:100%; background:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>🧩 NeuroBridge</h1>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<script src="shared.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
