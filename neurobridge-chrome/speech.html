<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>NeuroBridge — Speech check</title>
<style>
  body { max-width: 560px; margin: 40px auto; font-family: system-ui, sans-serif; background: #F6F8F7; color: #1D2B27; padding: 0 20px 60px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #5C6D67; font-size: 14px; }
  .panel { background: #fff; border: 1px solid #DCE6E2; border-radius: 12px; padding: 18px; margin-top: 16px; }
  button { padding: 9px 16px; border-radius: 10px; border: none; background: #1F7A6C; color: #fff; cursor: pointer; font-size: 14px; }
  button.secondary { background: #E3F0EC; color: #1F7A6C; }
  textarea { width: 100%; min-height: 80px; border-radius: 8px; border: 1px solid #DCE6E2; padding: 10px; font-family: inherit; font-size: 14px; }
  .status { color: #5C6D67; font-size: 13px; margin-top: 8px; }
  .stats { display: flex; gap: 16px; margin-top: 10px; font-size: 13px; color: #5C6D67; }
  .stats b { color: #1D2B27; }
  .tabs { display: flex; gap: 8px; margin-top: 8px; }
  .tab-btn { background: #F6F8F7; color: #5C6D67; border: 1px solid #DCE6E2; padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; }
  .tab-btn[aria-pressed="true"] { background: #1F7A6C; color: #fff; border-color: #1F7A6C; }
  .history-item { border-top: 1px solid #DCE6E2; padding: 10px 0; font-size: 13px; }
  .history-item:first-child { border-top: none; }
  .history-time { color: #5C6D67; font-size: 11px; }
  .clear-btn { background: none; color: #E4664A; text-decoration: underline; padding: 0; font-size: 12px; }
</style>
</head>
<body>
  <h1>🎙️ NeuroBridge — Speech check</h1>
  <p class="sub">Rehearse something out loud or by typing, and get feedback on wording, pace, and filler words — before you say it to someone.</p>

  <div class="tabs">
    <button class="tab-btn" data-tab="voice" aria-pressed="true">Speak it</button>
    <button class="tab-btn" data-tab="type" aria-pressed="false">Type it instead</button>
  </div>

  <div class="panel" id="voicePanel">
    <button id="micBtn">Start speaking</button>
    <div id="transcript" class="status"></div>
  </div>

  <div class="panel" id="typePanel" style="display:none;">
    <textarea id="typedInput" placeholder="Type what you're planning to say…"></textarea>
    <div style="margin-top:10px;"><button id="checkTypedBtn">Check wording</button></div>
  </div>

  <div class="panel">
    <div id="stats" class="stats" style="display:none;"></div>
    <div id="output">Feedback will appear here.</div>
  </div>

  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <strong style="font-size:14px;">Past attempts</strong>
      <button class="clear-btn" id="clearHistoryBtn">Clear</button>
    </div>
    <div id="history"><p class="sub">Nothing yet — your practice attempts will show up here.</p></div>
  </div>

  <script src="speech.js"></script>
</body>
</html>
