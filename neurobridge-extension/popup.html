<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { width: 320px; font-family: system-ui, sans-serif; padding: 14px; background: #F6F8F7; color: #1D2B27; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; font-size: 12px; color: #5C6D67; margin: 12px 0 6px; }
  input[type=password], select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #DCE6E2; font-family: inherit; }
  button { padding: 8px 12px; border-radius: 8px; border: none; background: #1F7A6C; color: #fff; cursor: pointer; font-family: inherit; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .status { font-size: 12px; color: #5C6D67; margin-top: 6px; }
  .tip { font-size: 11px; color: #5C6D67; margin-top: 6px; }
  hr { border: none; border-top: 1px solid #DCE6E2; margin: 16px 0; }
  .placeholder { color: #5C6D67; font-size: 13px; }
</style>
</head>
<body>
  <h1>🧩 NeuroBridge</h1>

  <label for="apiKeyInput">Gemini API key</label>
  <input type="password" id="apiKeyInput" placeholder="Paste your key" />
  <div class="row"><button id="saveKeyBtn">Save</button><span class="status" id="keyStatus"></span></div>
  <div class="tip">Select text on any page → right-click → "NeuroBridge: Simplify" or "Break into steps."</div>

  <hr />

  <label>Speech check</label>
  <button id="openSpeechBtn">🎙️ Open speech check</button>
  <div class="tip">Opens in its own tab — mic permission prompts don't survive inside this popup.</div>

  <hr />

  <label>Calm &amp; focus sound</label>
  <div class="row">
    <select id="soundType">
      <option value="white">White noise</option>
      <option value="brown">Deep / brown noise</option>
      <option value="tone">Low steady tone</option>
    </select>
    <button id="soundToggle">▶</button>
  </div>
  <input type="range" id="volSlider" min="0" max="100" value="30" style="width:100%;margin-top:8px;" />
  <div class="tip">Keeps playing after you close this popup. Reopen and click ⏸ to stop it.</div>

  <script src="popup.js"></script>
</body>
</html>
